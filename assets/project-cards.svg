height="203" rx="10" fill="#191e27" stroke="#3a4556"/><text x="536" y="253" fill="#8d9aaf" font-size="12" font-weight="400">04</text><text x="536" y="291" fill="#fafafa" font-size="21" font-weight="600">AI 内容与运营中台</text><text x="536" y="321" fill="#a8b4c8" font-size="12" font-weight="400">内容生产 / 流程编排</text><path d="M536 342h440" stroke="#3a4556"/><text x="536" y="372" fill="#d9e2f0" font-size="15" font-weight="400">生产效率 +30% · 一次可用率 58% → 80%</text><text x="536" y="397" fill="#d9e2f0" font-size="15" font-weight="400">任务成功率 72% → 90%</text></g></svg>
